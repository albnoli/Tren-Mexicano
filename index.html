<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tren Mexicano Premium</title>
    <!-- Librería para el Confeti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --primary: #4A00E0; 
            --secondary: #8E2DE2; 
            --accent: #FFD700;
            --text: #333;
        }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
            background: linear-gradient(135deg, var(--secondary), var(--primary)); 
            color: var(--text);
            min-height: 100vh;
            padding: 15px;
        }
        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 20px; 
            max-width: 600px; 
            margin: auto; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
        }
        h2, h3 { text-align: center; color: var(--primary); margin-top: 0; }
        
        /* Diseño compacto para las entradas */
        .grid-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-card {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e1e4e8;
        }
        .input-card label { font-weight: bold; font-size: 14px; display: block; margin-bottom: 5px; color: var(--primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        .input-card input { 
            width: 80%; 
            padding: 8px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            text-align: center; 
            font-size: 16px;
        }

        .setup-card { display: flex; gap: 10px; margin-bottom: 15px; }
        .setup-card input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid #ccc; font-size: 16px; }
        
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px; 
            transition: transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.98); }
        .btn-add { background: var(--secondary); color: white; width: auto; padding: 12px 20px; }
        .btn-start { background: var(--primary); color: white; margin-top: 10px; }
        .btn-round { background: #27ae60; color: white; }
        .btn-end { background: #e74c3c; color: white; margin-top: 20px; }
        .btn-reset { background: #7f8c8d; color: white; margin-top: 10px; }
        
        .player-badge { background: #e1b12c; color: white; padding: 5px 12px; border-radius: 20px; display: inline-block; margin: 5px; font-weight: bold; font-size: 14px; }
        
        /* Tabla mejorada */
        .table-container { overflow-x: auto; margin-top: 15px; border-radius: 10px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; background: white; font-size: 14px; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: #f8f9fa; color: var(--primary); }
        .total-row { font-weight: bold; background: #fff3cd; color: #856404; font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="setup">
            <h2>🚂 Tren Mexicano</h2>
            <div class="setup-card">
                <input type="text" id="playerName" placeholder="Nombre del jugador">
                <button class="btn-add" onclick="addPlayer()">+</button>
            </div>
            <div id="playerList"></div>
            <button class="btn-start" onclick="startGame()">Empezar Juego</button>
        </div>

        <div id="game" style="display:none;">
            <div id="inputsContainer"></div>
            <button class="btn-round" onclick="finishRound()">+ Sumar Ronda</button>
            
            <div class="table-container">
                <table id="historyTable">
                    <thead><tr id="headerRow"><th>R#</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                    <tfoot><tr id="footerRow" class="total-row"><td>TOT</td></tr></tfoot>
                </table>
            </div>
            
            <button class="btn-end" onclick="showWinner()">🏆 Finalizar Juego</button>
            <button class="btn-reset" onclick="resetGame()">🔄 Borrar todo y empezar de cero</button>
        </div>
    </div>

    <script>
        let players = [];
        let roundCount = 1;
        let isGameStarted = false;

        // Cargar datos guardados al abrir la app
        window.onload = () => {
            const savedData = localStorage.getItem('trenMexicanoSave');
            if (savedData) {
                const data = JSON.parse(savedData);
                players = data.players || [];
                roundCount = data.roundCount || 1;
                isGameStarted = data.isGameStarted || false;

                if (isGameStarted) {
                    document.getElementById('setup').style.display = 'none';
                    document.getElementById('game').style.display = 'block';
                    rebuildGameUI();
                } else {
                    players.forEach(p => {
                        document.getElementById('playerList').innerHTML += `<span class="player-badge">${p.name}</span>`;
                    });
                }
            }
        };

        // Función para guardar en la memoria del teléfono
        function saveGame() {
            localStorage.setItem('trenMexicanoSave', JSON.stringify({ players, roundCount, isGameStarted }));
        }

        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            if(name) {
                players.push({ name: name, total: 0, history: [] }); // Añadimos historial a cada jugador
                document.getElementById('playerList').innerHTML += `<span class="player-badge">${name}</span>`;
                document.getElementById('playerName').value = '';
                saveGame();
            }
        }

        function startGame() {
            if(players.length === 0) return alert("Añade al menos un jugador");
            isGameStarted = true;
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            saveGame();
            rebuildGameUI();
        }

        // Esta función reconstruye la pantalla si recargas la página
        function rebuildGameUI() {
            const header = document.getElementById('headerRow');
            const footer = document.getElementById('footerRow');
            const tbody = document.getElementById('historyBody');
            
            header.innerHTML = '<th>R#</th>';
            footer.innerHTML = '<td>TOT</td>';
            tbody.innerHTML = '';

            players.forEach(p => {
                header.innerHTML += `<th>${p.name.substring(0,3).toUpperCase()}</th>`;
                footer.innerHTML += `<td id="total-${p.name}">${p.total}</td>`;
            });

            // Reconstruir rondas anteriores
            for (let r = 0; r < roundCount - 1; r++) {
                let row = `<tr><td>${r + 1}</td>`;
                players.forEach(p => {
                    row += `<td>${p.history[r]}</td>`;
                });
                row += `</tr>`;
                tbody.innerHTML += row;
            }

            renderInputs();
        }

        function renderInputs() {
            const container = document.getElementById('inputsContainer');
            let html = `<h3>Puntos Ronda ${roundCount}</h3><div class="grid-inputs">`;
            players.forEach((p, i) => {
                html += `
                    <div class="input-card">
                        <label>${p.name}</label>
                        <input type="number" id="pts-${i}" placeholder="0" inputmode="numeric">
                    </div>`;
            });
            html += `</div>`;
            container.innerHTML = html;
        }

        function finishRound() {
            players.forEach((p, i) => {
                const val = parseInt(document.getElementById(`pts-${i}`).value) || 0;
                p.total += val;
                p.history.push(val); // Guardamos lo que hizo en esta ronda
            });
            
            roundCount++;
            saveGame();
            rebuildGameUI(); // Refresca la tabla
        }

        function showWinner() {
            let copyPlayers = [...players];
            copyPlayers.sort((a, b) => a.total - b.total); // El de menos puntos gana
            
            let winnerName = copyPlayers[0].name;
            let res = "🏆 RESULTADOS FINALES:\n\n";
            
            copyPlayers.forEach((p, i) => {
                let medal = i === 0 ? "🥇 " : i === 1 ? "🥈 " : i === 2 ? "🥉 " : "   ";
                res += `${medal} ${i+1}. ${p.name}: ${p.total} pts\n`;
            });

            // Lluvia de Confeti
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

            // Voz en alta
            if ('speechSynthesis' in window) {
                let msg = new SpeechSynthesisUtterance(`¡Felicidades ${winnerName}, eres el ganador absoluto del tren mexicano!`);
                msg.lang = 'es-MX'; 
                msg.rate = 1.0;
                window.speechSynthesis.speak(msg);
            }

            setTimeout(() => { alert(res); }, 500);
        }

        // Nueva función para borrar la memoria
        function resetGame() {
            if(confirm("¿Seguro que quieres borrar la partida actual y empezar de cero?")) {
                localStorage.removeItem('trenMexicanoSave');
                location.reload(); // Recarga la página para volver al inicio
            }
        }
    </script>
</body>
</html>
