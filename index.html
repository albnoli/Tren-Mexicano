<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tren Mexicano Pro</title>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --success: #27ae60; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: #f4f7f6; color: #333; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 16px; margin-top: 5px; }
        .btn-add { background: var(--accent); color: white; }
        .btn-round { background: var(--success); color: white; margin-top: 20px; }
        .btn-end { background: var(--danger); color: white; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #eee; padding: 10px; text-align: center; }
        th { background: var(--primary); color: white; }
        .total-row { font-weight: bold; background: #f9f9f9; }
        .badge { background: #eee; padding: 2px 8px; border-radius: 10px; font-size: 0.8em; }
    </style>
</head>
<body>
    <div class="container">
        <div id="setup">
            <h2>🚂 Tren Mexicano</h2>
            <div class="card">
                <input type="text" id="playerName" placeholder="Nombre del jugador">
                <button class="btn-add" onclick="addPlayer()">Añadir Jugador</button>
                <div id="playerList" style="margin-top:10px;"></div>
                <button class="btn-round" style="background:var(--primary)" onclick="startGame()">Empezar Juego</button>
            </div>
        </div>

        <div id="game" style="display:none;">
            <div id="inputsContainer"></div>
            <button class="btn-round" onclick="finishRound()">Finalizar Ronda</button>
            
            <h3>Historial y Totales</h3>
            <div style="overflow-x: auto;">
                <table id="historyTable">
                    <thead><tr id="headerRow"><th>Ronda</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                    <tfoot><tr id="footerRow" class="total-row"><td>TOTAL</td></tr></tfoot>
                </table>
            </div>
            
            <button class="btn-end" onclick="showWinner()">Finalizar Juego (Ranking)</button>
        </div>
    </div>

    <script>
        let players = [];
        let roundCount = 1;

        function addPlayer() {
            const name = document.getElementById('playerName').value;
            if(name) {
                players.push({ name: name, history: [], total: 0 });
                document.getElementById('playerList').innerHTML += `<div>👤 ${name}</div>`;
                document.getElementById('playerName').value = '';
            }
        }

        function startGame() {
            if(players.length === 0) return alert("Añade al menos un jugador");
            document.getElementById('setup').style.display = 'none';
            document.getElementById('game').style.display = 'block';
            
            // Preparar encabezados de tabla
            const header = document.getElementById('headerRow');
            const footer = document.getElementById('footerRow');
            players.forEach(p => {
                header.innerHTML += `<th>${p.name}</th>`;
                footer.innerHTML += `<td id="total-${p.name}">0</td>`;
            });
            renderInputs();
        }

        function renderInputs() {
            const container = document.getElementById('inputsContainer');
            container.innerHTML = `<h3>Puntos Ronda ${roundCount}</h3>`;
            players.forEach((p, i) => {
                container.innerHTML += `
                    <div class="card">
                        <label>${p.name}</label>
                        <input type="number" id="pts-${i}" placeholder="0" inputmode="numeric">
                    </div>`;
            });
        }

        function finishRound() {
            let row = `<tr><td>${roundCount}</td>`;
            players.forEach((p, i) => {
                const val = parseInt(document.getElementById(`pts-${i}`).value) || 0;
                p.history.push(val);
                p.total += val;
                row += `<td>${val}</td>`;
                document.getElementById(`total-${p.name}`).innerText = p.total;
            });
            row += `</tr>`;
            document.getElementById('historyBody').innerHTML += row;
            
            roundCount++;
            renderInputs();
            window.scrollTo(0,0);
        }

        function showWinner() {
            let copyPlayers = [...players];
            copyPlayers.sort((a, b) => a.total - b.total);
            let res = "🏆 RESULTADOS FINALES:\n\n";
            copyPlayers.forEach((p, i) => {
                res += `${i+1}. ${p.name}: ${p.total} pts\n`;
            });
            alert(res);
        }
    </script>
</body>
</html>
